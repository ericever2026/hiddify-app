name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart pub global activate fastforge

      - name: Download Hiddify Core
        run: |
          mkdir -p android/app/libs
          curl -L https://github.com/hiddify/hiddify-next-core/releases/download/v4.0.4/hiddify-core-android.tar.gz | tar xz -C android/app/libs/

      - name: Build APK
        env:
          SENTRY_DSN: ""
        run: |
          fastforge package \
            --platform android \
            --targets apk \
            --skip-clean \
            --build-target=lib/main_prod.dart \
            --build-target-platform=android-arm,android-arm64,android-x64 \
            --build-dart-define=sentry_dsn=

      - name: List outputs
        run: |
          ls -R build/app/outputs/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v3
        with:
          name: android-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
